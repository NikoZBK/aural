name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test DSP, imports, and startup
        run: bash scripts/test.sh
      - name: Package universal macOS app
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aural-universal
          path: |
            dist/Aural-*-universal.dmg
            dist/Aural-*-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
