name: AuralRoutePrototype
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    GCC_C_LANGUAGE_STANDARD: c11
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)"]
    OTHER_CFLAGS: ["$(inherited)", "-fblocks"]
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "12"
    AURAL_DIAGNOSTIC_RECEIVER_IPV4: ""
    HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Shared", "$(SRCROOT)/../../Sources/DSP/include"]
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1"]
targets:
  AuralRouteTest:
    type: application
    platform: iOS
    sources:
      - Receiver
      - Shared
      - path: ../../Sources/DSP/DSP.c
      - path: ../../Sources/DSP/include/DSP.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aural.route-probe.receiver
        INFOPLIST_FILE: Configuration/Receiver.plist
        SWIFT_OBJC_BRIDGING_HEADER: Receiver/Bridging-Header.h
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: AudioToolbox.framework
  AuralRouteProvider:
    type: application
    platform: iOS
    sources: [Provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aural.route-probe.provider
        INFOPLIST_FILE: Configuration/Provider.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Provider.entitlements
    dependencies:
      - target: AuralRouteExtension
        embed: true
        codeSign: true
  AuralRouteExtension:
    type: extensionkit-extension
    platform: iOS
    sources: [Extension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aural.route-probe.provider.extension
        INFOPLIST_FILE: Configuration/Extension.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Extension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridging-Header.h
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: MediaDevice.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: Network.framework
      - sdk: ExtensionFoundation.framework
schemes:
  AuralRouteTest:
    build:
      targets:
        AuralRouteTest: all
        AuralRouteProvider: all
    run:
      executable: AuralRouteTest
      config: Debug
  AuralRouteProvider:
    build:
      targets:
        AuralRouteProvider: all
    run:
      executable: AuralRouteProvider
      config: Debug
